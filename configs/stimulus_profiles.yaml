# Named stimulus profiles (managed by the GUI profile Load/Save as/Delete;
# hand-editing is fine too). Each entry = the full stimulus-panel state.
zebra classic:
  period_px: 157.5
  speed_px_s: 78.6
  direction: 1
  contrast: 1.0
  rotation_deg: 0.0
  region_preset: bottomhalf
  custom_rect:
  - 0
  - 540
  - 1920
  - 1080
  color_bright: '#ffffff'
  color_dark: '#000000'
  bg_color: '#000000'
  baseline_s: 2.0
  grating_s: 25.0
  circles:
    enabled: false
    ass_file: circles.ass
    style: fill
    pulse: true
    cycle_s: 2.0
    expand_row: top
    soft_px: 5.0
    window_bg: '#636363'
    colors_from_ass: true
    size_top: 1.0
    size_bottom: 1.0
    nth_top: 1
    nth_bottom: 1
    color_top: '#000000'
    color_bottom: '#000000'
